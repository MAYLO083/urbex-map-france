name: Lieux proposés (modération)

# Seul le propriétaire du dépôt modère :
#  - label « validé » posé  → le lieu est ajouté à la carte et l'issue est fermée
#  - label « validé » retiré → le lieu est retiré de la carte
# Un label posé par quelqu'un d'autre que le propriétaire est ignoré.
on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: community-spots
  cancel-in-progress: false

jobs:
  moderate:
    if: >-
      github.event.label.name == 'validé' &&
      github.event.sender.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mettre à jour la liste des lieux
        id: spot
        env:
          ACTION: ${{ github.event.action == 'labeled' && 'add' || 'remove' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/add_community_spot.py >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spots_communaute.json
          git diff --cached --quiet || git commit -m "Lieu de la communauté : ${{ github.event.action == 'labeled' && 'ajout' || 'retrait' }} (#${{ github.event.issue.number }})"
          git pull --rebase -q
          git push
      - name: Répondre sur l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.spot.outputs.summary }}
        run: |
          if [ "${{ github.event.action }}" = "labeled" ]; then
            printf '✅ Ajouté à la carte (visible d'"'"'ici quelques minutes) :\n\n%s\n\nPour le retirer : enlève le label `validé`.' "$SUMMARY" > body.md
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file body.md
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "🗑️ Lieu retiré de la carte."
          fi
