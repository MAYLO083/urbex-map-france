name: Lieux signalés (modération)

# Signalements (formulaire « 🚩 Signaler un lieu » : démoli, rénové, habité…).
# Seul le propriétaire du dépôt modère :
#  - label « validé » posé  → le lieu est retiré de la carte et l'issue est fermée
#  - label « validé » retiré → le lieu réapparaît
# Un label posé par quelqu'un d'autre que le propriétaire est ignoré.
on:
  issues:
    types: [labeled, unlabeled]

permissions:
  contents: write
  issues: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  moderate:
    if: >-
      github.event.label.name == 'validé' &&
      github.event.sender.login == github.repository_owner &&
      contains(github.event.issue.labels.*.name, 'signalement')
    runs-on: ubuntu-latest
    outputs:
      summary: ${{ steps.spot.outputs.summary }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mettre à jour la liste des lieux retirés
        id: spot
        env:
          ACTION: ${{ github.event.action == 'labeled' && 'add' || 'remove' }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python scripts/report_spot.py >> "$GITHUB_OUTPUT"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lieux_retires.json
          git diff --cached --quiet || git commit -m "Signalement : ${{ github.event.action == 'labeled' && 'lieu retiré' || 'lieu rétabli' }} (#${{ github.event.issue.number }})"
          git pull --rebase -q
          git push
      - name: Répondre sur l'issue
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.spot.outputs.summary }}
        run: |
          if [ "${{ github.event.action }}" = "labeled" ]; then
            printf '✅ Merci pour le signalement ! Le lieu est retiré de la carte (visible d'"'"'ici quelques minutes) :\n\n%s\n\nPour annuler : enlève le label `validé`.' "$SUMMARY" > body.md
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body-file body.md
            gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }}
          else
            gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "↩️ Signalement annulé : le lieu réapparaît sur la carte."
          fi

  publier:
    needs: moderate
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-site.yml

