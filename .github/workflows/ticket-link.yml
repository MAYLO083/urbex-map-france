name: Lien vers la carte dans les tickets

# Les tickets envoyés depuis la carte ont déjà un lien « 📍 Voir sur la carte ».
# Pour ceux créés avec les formulaires GitHub, on l'ajoute en commentaire.
on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  lien:
    if: >-
      (contains(github.event.issue.labels.*.name, 'signalement') || contains(github.event.issue.labels.*.name, 'proposition')) &&
      !contains(github.event.issue.body, 'Voir sur la carte')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire le lien
        id: lien
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import os, re, sys, urllib.parse
          sys.path.insert(0, "scripts")
          from add_community_spot import parse
          f = parse(os.environ["ISSUE_BODY"])
          site = "https://maylo083.github.io/urbex-map-france/"
          refs = re.findall(r"\b[a-z_]+:[A-Za-z0-9_.-]+", f.get("identifiant du lieu (ne pas modifier)", ""))
          pos = re.search(r"(-?\d{1,2}[.,]\d+)\s*[,; ]\s*(-?\d{1,3}[.,]\d+)", f.get("position", "") or f.get("coordonnées gps", ""))
          lat, lon = (pos.group(1).replace(",", "."), pos.group(2).replace(",", ".")) if pos else (None, None)
          if refs:
              url = site + "?lieu=" + urllib.parse.quote(" ".join(refs)) + (f"#18/{lat}/{lon}" if lat else "")
          elif lat:
              url = f"{site}?repere={lat},{lon}#17/{lat}/{lon}"
          else:
              url = ""
          print(f"url={url}")
          EOF
      - name: Commenter
        if: steps.lien.outputs.url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment ${{ github.event.issue.number }} --repo ${{ github.repository }} --body "**[📍 Voir sur la carte](${{ steps.lien.outputs.url }})**"
