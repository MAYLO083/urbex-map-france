name: Mise à jour des spots

on:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi à 4h UTC
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données Wikidata
        run: python scripts/fetch_wikidata.py
        continue-on-error: true
      - name: Télécharger Mérimée, Cartofriches et CASIAS
        run: python scripts/fetch_opendata.py --fresh
        continue-on-error: true
      - name: Télécharger les données OpenStreetMap
        run: python scripts/fetch_spots.py
        continue-on-error: true
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git diff --cached --quiet || git commit -m "Mise à jour automatique des spots"
          git push
