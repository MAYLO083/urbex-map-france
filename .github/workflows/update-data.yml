name: Mise à jour des spots

on:
  schedule:
    - cron: "0 4 * * 1"   # chaque lundi à 4h UTC
  workflow_dispatch:       # bouton "Run workflow" dans l'onglet Actions

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données Wikidata
        run: python scripts/fetch_wikidata.py
        continue-on-error: true
      - name: Télécharger Mérimée, Cartofriches et CASIAS
        run: python scripts/fetch_opendata.py --fresh
        continue-on-error: true
      - name: Installer les outils OpenStreetMap
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install -q osmium
      - name: Lieux OpenStreetMap (extrait officiel France, Geofabrik)
        run: python scripts/fetch_osm_extract.py
        continue-on-error: true
      - name: Préparer les tuiles (fusion des doublons, découpage par zone)
        run: python scripts/build_tiles.py
      - name: Commit si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git diff --cached --quiet || git commit -m "Mise à jour automatique des spots"
          git pull --rebase -q
          git push
