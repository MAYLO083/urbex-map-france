# Relais Urbex Map → GitHub : signalements et propositions sans compte (voir src/index.js)
name = "urbex-map-relais"
main = "src/index.js"
compatibility_date = "2026-11-01"

[vars]
REPO = "MAYLO083/urbex-map-france"
ALLOWED_ORIGINS = "https://maylo083.github.io,http://localhost:8000"

# 5 envois par minute et par adresse IP
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }
